Enabled: LocomanipController
MainRobot: HRP5P
Timestep: 0.002
GUIServer:
  Enable: false
Log: false
OverwriteConfigKeys:
- MjlabSafetyFrozen
OverwriteConfigList:
  MjlabSafetyFrozen:
    MainRobot: HRP5P
    VerboseLoader: false
    Enabled: LocomanipController
    InitAttitudeFromSensor: false
    InitAttitudeSensor: ''
    Timestep: 0.002
    LogTemplate: mc-control
    GUIServer:
      TCP:
        Host: '*'
        Ports:
        - 4242
        - 4343
      Timestep: 0.05
      IPC: {}
      Enable: false
    Log: false
    Managed: false
    StepByStep: true
    IdleKeepState: true
    StatesLibraries:
    - /home/martin/workspace/install/lib/mc_controller/fsm/states
    - /home/martin/workspace/install/lib/mc_controller/baseline_walking_controller/states
    - /home/martin/workspace/install/lib/mc_controller/locomanip_controller/states
    StatesFiles:
    - /home/martin/workspace/install/lib/mc_controller/fsm/states/data
    - /home/martin/workspace/install/lib/mc_controller/baseline_walking_controller/states/data
    - /home/martin/workspace/install/lib/mc_controller/locomanip_controller/states/data
    VerboseStateFactory: false
    constraints:
    - type: contact
    - type: kinematics
      damper:
      - 0.1
      - 0.01
      - 0.5
    - type: compoundJoint
    collisions:
    - type: collision
      useMinimal: true
    contacts: []
    states:
      MjlabSafety::LMC::Initial_:
        base: LMC::Initial
        configs:
          gripperCommands:
          - name: l_gripper
            opening: 1.0
          - name: r_gripper
            opening: 1.0
          autoStartTime: 0.0
      MjlabSafety::LMC::GuiManip_:
        base: LMC::GuiManip
      MjlabSafety::LMC::Teleop_:
        base: LMC::Teleop
        configs:
          twistTopicName: /cmd_vel
      MjlabSafety::LMC::PushCart_:
        base: LMC::ConfigManip
        configs:
          reach: true
          release: true
          waypointList:
          - duration: 30.0
            relPose:
              translation:
              - 1.0
              - 0
              - 0
          preHandWrenches:
            Left:
              force:
              - 0.0
              - 0.0
              - 0.0
              couple:
              - 0.0
              - 0.0
              - 0.0
            Right:
              force:
              - 0.0
              - 0.0
              - 0.0
              couple:
              - 0.0
              - 0.0
              - 0.0
          HandWrenchAdaptation:
            enable: true
            alpha: 0.03
            forceProjection:
            - 0.0
            - 0.0
            - 0.98
            momentProjection:
            - 0.0
            - 0.0
            - 0.0
      MjlabSafety::LMC::Main_:
        base: Parallel
        states:
        - MjlabSafety::LMC::GuiManip_
        - MjlabSafety::LMC::Teleop_
      MjlabSafety::LMC::Exit_:
        base: LMC::Exit
      MjlabSafety::LMC::Pause_:
        base: Pause
        duration: 3600
    transitions:
    - - LMC::Initial_
      - OK
      - LMC::PushCart_
      - Auto
    - - LMC::PushCart_
      - OK
      - LMC::Pause_
      - Auto
    - - LMC::Pause_
      - OK
      - LMC::Exit_
      - Auto
    init: LMC::Initial_
    CompletionState: MjlabSafety::LMC::Pause_
    ObserverPipelines:
      name: MainObserverPipeline
      gui: true
      observers:
      - type: Encoder
      - type: Attitude
        config:
          KalmanFilter:
            gyr_cov: 1.0e-06
      - type: KinematicInertial
        config:
          anchorFrame:
            maxAnchorFrameDiscontinuity: 0.05
    controllerName: LMC
    PostureTask:
      stiffness: 10
      jointWeights:
        WP: 50
        WR: 50
        WY: 50
    CoMTask:
