repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: clang-format
        name: clang-format
        entry: clang-format -i
        language: system
        types_or: [c++, c]

      - id: check-prose
        name: check prose budget
        entry: python3 scripts/check_prose.py
        language: system
        types: [python]
        files: ^(src|scripts|tests)/

      # A Python-only commit never builds the C++ side. The native hook below
      # excludes ctest's `python` test, which this one already ran.
      - id: pytest
        name: pytest (tests/)
        entry: uv run pytest -q
        language: system
        types_or: [python, c++, c, cmake]
        pass_filenames: false

      - id: ctest
        name: ctest (C++)
        entry: cmake --build build --target check-native
        language: system
        types_or: [c++, c, cmake]
        pass_filenames: false
