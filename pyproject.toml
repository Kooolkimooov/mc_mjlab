[build-system]
# scikit-build-core, not uv_build: `uv sync` must configure and build
# src/mc_rtc_interface, whose extension module the package imports natively.
requires = ["scikit-build-core>=0.11", "nanobind>=3.0.1"]
build-backend = "scikit_build_core.build"

[project]
name = "mc-mjlab"
version = "0.1.0"
description = "mc_rtc controller integration and HRP5P assets for mjlab."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Martin Filliung" }]
# mc_rtc's Python bindings are interpreter-specific: this pin must match the
# interpreter the ROS workspace built them for (see README), and moves with it.
requires-python = ">=3.14,<3.15"
dependencies = [
    # Where mjlab comes from (PyPI, local checkout, git) is a per-machine
    # choice: see "mjlab dependency" in the README.
    "mjlab",
    # Imported directly by this package; versions are constrained by mjlab.
    "mujoco",
    "nanobind>=3.0.1",
    "torch",
]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
    "ty>=0.0.14",
    # Static extraction for scripts/generate_architecture_docs.py; none import
    # the package, so the docs build needs no mc_rtc workspace.
    "pylint>=4.0.7",
    "griffe>=2.2.0",
    "grimp>=3.15",
    "markdown>=3.10",
    # Builds and tests src/mc_rtc_interface: nanobind is found through
    # `python -m nanobind --cmake_dir`, so it must live in this interpreter.
    "nanobind>=3.0.1",
    # The build backend itself: builds run unisolated (see [tool.uv] below),
    # so it has to be present here rather than in an ephemeral build env.
    "scikit-build-core>=0.11",
    "pytest>=8.0",
]

[tool.scikit-build]
cmake.source-dir = "src/mc_rtc_interface"
# A persistent build dir is what makes both entry points share one tree: uv
# sync configures it, `cmake --build build` reuses it, and neither rebuild
# path works without it.
build-dir = "build"
# Stale .cpp edits rebuild on import; uv sync alone never sees them.
editable.rebuild = true
# That rebuild's banner is the one thing it writes to stdout, so it corrupts
# any `$(uv run python -c ...)` capture. SKBUILD_EDITABLE_VERBOSE=1 brings it
# back; a failed rebuild still prints.
editable.verbose = false
minimum-version = "build-system.requires"

[tool.scikit-build.wheel]
packages = ["src/mc_mjlab"]

[tool.uv]
# This package is developed on a single Linux/CUDA box; resolve for it only.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# CMake caches the interpreter path it configured with. An isolated build env
# lives under ~/.cache/uv/builds-v0/ and is deleted afterwards, so every later
# reconfigure of build/ -- including the import-time rebuild -- fails on a
# missing interpreter. Building against .venv keeps that path alive, and the
# mc_rtc bindings are interpreter-specific anyway.
no-build-isolation-package = ["mc-mjlab"]

[project.entry-points."mjlab.tasks"]
mc_mjlab = "mc_mjlab.tasks"

[tool.pytest.ini_options]
# Without it a bare `uv run pytest` walks .venv and collects torch's own test
# modules, which error out at import.
testpaths = ["tests"]
# `scripts/evaluation` is repository-only and not in the wheel, so it is reached
# by path, not by install. The ty entry below must match or it reports every
# `evaluation.*` import unresolved.
pythonpath = ["scripts"]

[tool.ty.environment]
extra-paths = ["scripts"]

[tool.ruff]
src = ["src"]
indent-width = 2
# Pin the formatter's target below requires-python: left to infer it, ruff
# adopts newer-only syntax (e.g. PEP 758 `except A, B:`) that older
# interpreters cannot parse, and requires-python moves with whichever
# interpreter the mc_rtc bindings are built for.
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ANN"]
# ANN401: `Any` is the honest annotation where the untyped mc_rtc bindings cross
# into Python; ANN requires an annotation, `ty` judges whether it is right.
ignore = ["B011", "ANN401"]
